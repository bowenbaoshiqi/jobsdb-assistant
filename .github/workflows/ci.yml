name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.13
      - run: uv venv && uv pip install -e ".[dev,dashboard]"
      - run: uv run python scripts/privacy_guard.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.13
      - run: uv venv && uv pip install -e ".[dev,dashboard]"
      - run: >-
          uv run pytest -m 'not e2e'
          --cov=src --cov-branch --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.13
      - run: uv venv && uv pip install -e ".[dev,dashboard]"
      - run: uv run ruff check src/ tests/ scripts/privacy_guard.py
